<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meriride - Fleet Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#050b14] text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-6 rounded-2xl mb-8 shadow-xl">
            <div>
                <h1 class="text-2xl font-black text-white">Fleet Management</h1>
                <p class="text-sm text-slate-400">Add buses with automatic school prefixes, manage drivers, and access PINs.</p>
            </div>
            <a href="school-dashboard.html" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition">← Back</a>
        </div>

        <!-- Add Driver Form -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl mb-8">
            <h2 class="text-lg font-bold text-emerald-400 mb-4">Assign New Bus & Driver</h2>
            
            <form id="fleetForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- Unique Bus ID Prefix Input Group -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Bus Unique ID (For GPS App)</label>
                    <div class="flex rounded-lg overflow-hidden border border-slate-700 bg-slate-800">
                        <span id="schoolCodePrefix" class="bg-slate-700 text-cyan-400 font-bold px-4 flex items-center text-sm border-r border-slate-600">SCH-</span>
                        <input type="text" id="busSuffix" placeholder="e.g. 01 or 123" required class="w-full bg-transparent p-3 text-white text-sm outline-none">
                    </div>
                </div>

                <!-- Physical Bus Registration Number -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Physical Bus Number (For Records)</label>
                    <input type="text" id="physicalBusNo" placeholder="e.g. UP 47 1234" required class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-white text-sm outline-none">
                </div>

                <!-- Driver Name -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Driver Name</label>
                    <input type="text" id="driverName" placeholder="Enter driver name" required class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-white text-sm outline-none">
                </div>

                <!-- Driver Phone -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Driver Phone (For Login)</label>
                    <input type="tel" id="driverPhone" placeholder="Enter phone number" required class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-white text-sm outline-none">
                </div>

                <button type="submit" id="submitBtn" class="md:col-span-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-3.5 rounded-lg transition shadow-lg shadow-emerald-600/20 mt-2">
                    Assign Bus & Generate PIN
                </button>
            </form>
        </div>

        <!-- Fleet List -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
            <table class="w-full text-left">
                <thead class="bg-slate-800/50 text-slate-400 uppercase text-xs">
                    <tr>
                        <th class="p-4">Unique Bus ID (GPS)</th>
                        <th class="p-4">Physical Bus No</th>
                        <th class="p-4">Driver & Phone</th>
                        <th class="p-4 text-center">Login PIN</th>
                        <th class="p-4 text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="fleetList" class="divide-y divide-slate-800">
                    <tr><td colspan="5" class="p-6 text-center text-slate-500">Loading Fleet...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tvwhtyxosovscygvahow.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2d2h0eXhvc292c2N5Z3ZhaG93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MDA2MzksImV4cCI6MjEwMTE3NjYzOX0.kVLKQsl4gfIex7LQJqh-GXl-QgEIdvqK8mY7AoauzGI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const school = JSON.parse(localStorage.getItem('meriride_user'));
        const schoolCode = school ? (school.verification_code || "SCH") : "SCH";

        // Set Prefix UI
        document.getElementById('schoolCodePrefix').textContent = schoolCode + "-";

        async function loadFleet() {
            const { data, error } = await _supabase.from('school_fleet').select('*').eq('school_id', school.id);
            const list = document.getElementById('fleetList');
            
            if (!data || data.length === 0) {
                list.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-500">No buses assigned yet.</td></tr>`;
                return;
            }

            list.innerHTML = data.map(item => `
                <tr class="hover:bg-slate-800/30">
                    <td class="p-4 font-bold text-cyan-400 font-mono">${item.bus_number}</td>
                    <td class="p-4 text-slate-300 font-mono text-xs">${item.physical_bus_number || 'N/A'}</td>
                    <td class="p-4"><b>${item.driver_name}</b><br><span class="text-xs text-slate-400 font-mono">${item.driver_phone}</span></td>
                    <td class="p-4 text-center text-xl font-mono text-emerald-400 font-bold tracking-widest">${item.driver_pin}</td>
                    <td class="p-4 text-center"><button onclick="deleteFleet('${item.id}')" class="text-rose-500 hover:text-rose-400 text-xs font-bold bg-rose-500/10 px-3 py-1.5 rounded-lg border border-rose-500/20">REMOVE</button></td>
                </tr>
            `).join('');
        }

        document.getElementById('fleetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving to Database...';

            const suffixInput = document.getElementById('busSuffix').value.trim().toUpperCase();
            const physicalNo = document.getElementById('physicalBusNo').value.trim();
            
            const uniqueBusId = `${schoolCode}-${suffixInput}`;
            const pin = Math.floor(1000 + Math.random() * 9000).toString();

            const { error } = await _supabase.from('school_fleet').insert([{
                school_id: school.id,
                bus_number: uniqueBusId,
                physical_bus_number: physicalNo,
                driver_name: document.getElementById('driverName').value.trim(),
                driver_phone: document.getElementById('driverPhone').value.trim(),
                driver_pin: pin
            }]);

            if (error) { 
                alert("Error: " + error.message); 
            } else { 
                alert(`Success! Bus Unique ID created: ${uniqueBusId}\nDriver PIN: ${pin}`); 
                location.reload(); 
            }
            
            submitBtn.disabled = false;
        });

        async function deleteFleet(id) {
            if(confirm("Delete this driver from fleet?")) {
                await _supabase.from('school_fleet').delete().eq('id', id);
                location.reload();
            }
        }

        loadFleet();
    </script>
</body>
</html>
